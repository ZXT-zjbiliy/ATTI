<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enneagram Personality Test | Truity</title>
  </head>
  <body>
    <main>
      <h1>Enneagram Personality Test</h1>
      <p>To take the Enneagram test, mark each statement based on how well it describes your personality.</p>
      <p>Step 1 of 11</p>
      <form action="/test/enneagram-personality-test" method="post">
        <fieldset data-atti-question-block="question-1">
          <legend>I strive for perfection</legend>
          <label><input type="radio" name="question-1" value="1" />Inaccurate</label>
          <label><input type="radio" name="question-1" value="2" />Somewhat Inaccurate</label>
          <label><input type="radio" name="question-1" value="3" />Neutral</label>
          <label><input type="radio" name="question-1" value="4" />Somewhat Accurate</label>
          <label><input type="radio" name="question-1" value="5" />Accurate</label>
        </fieldset>
        <fieldset data-atti-question-block="question-2">
          <legend>I work hard to be helpful to others</legend>
          <label><input type="radio" name="question-2" value="1" />Inaccurate</label>
          <label><input type="radio" name="question-2" value="2" />Somewhat Inaccurate</label>
          <label><input type="radio" name="question-2" value="3" />Neutral</label>
          <label><input type="radio" name="question-2" value="4" />Somewhat Accurate</label>
          <label><input type="radio" name="question-2" value="5" />Accurate</label>
        </fieldset>
      </form>
    </main>
  </body>
</html>
