<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DISC Personality Assessment</title>
  </head>
  <body>
    <main>
      <div class="markup">
        <p>To take the DISC assessment, consider how well each word or phrase describes you.</p>
      </div>
      <form method="POST">
        <section id="main-content">
          <div class="question-header">
            <p>In each pair, mark the circle near the word that describes you best.</p>
            <p>
              If neither word describes you or both describe you equally well, mark the circle in
              the center.
            </p>
          </div>
          <div class="question question-radio">
            <div class="mt-3">
              <div class="question-grid emphasized">
                <span class="radio-label emphasized">Open</span>
                <label class="radio"
                  ><input type="radio" name="t472" value="5" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t472" value="4" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t472" value="3" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t472" value="2" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t472" value="1" autocomplete="off"
                /></label>
                <span class="radio-label emphasized">Skeptical</span>
              </div>
            </div>
          </div>
          <div class="question question-radio">
            <div class="mt-3">
              <div class="question-grid emphasized">
                <span class="radio-label emphasized">Cheerful</span>
                <label class="radio"
                  ><input type="radio" name="t473" value="5" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t473" value="4" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t473" value="3" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t473" value="2" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t473" value="1" autocomplete="off"
                /></label>
                <span class="radio-label emphasized">Methodical</span>
              </div>
            </div>
          </div>
        </section>
        <div class="text-center">Step 1 of 6</div>
      </form>
    </main>
  </body>
</html>
