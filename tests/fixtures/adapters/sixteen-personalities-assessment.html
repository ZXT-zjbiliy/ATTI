<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Free Personality Test | 16Personalities</title>
  </head>
  <body>
    <main>
      <h1>Free Personality Test</h1>
      <p>Be yourself and answer honestly to find out your personality type.</p>
      <form action="/free-personality-test" method="post">
        <section data-atti-16p-question="question-1" class="question-card">
          <h3 data-atti-16p-prompt>You regularly make new friends.</h3>
          <div class="question-options" role="radiogroup" aria-label="Agree or disagree">
            <button type="button" data-value="1" aria-label="Strongly Agree">Agree</button>
            <button type="button" data-value="2" aria-label="Agree">Agree</button>
            <button type="button" data-value="3" aria-label="Slightly Agree">Agree</button>
            <button type="button" data-value="4" aria-label="Neutral">Neutral</button>
            <button type="button" data-value="5" aria-label="Slightly Disagree">Disagree</button>
            <button type="button" data-value="6" aria-label="Disagree">Disagree</button>
            <button type="button" data-value="7" aria-label="Strongly Disagree">Disagree</button>
          </div>
        </section>
        <section data-atti-16p-question="question-2" class="question-card">
          <h3 data-atti-16p-prompt>
            You spend a lot of your free time exploring various random topics that pique your
            interest.
          </h3>
          <div class="question-options" role="radiogroup" aria-label="Agree or disagree">
            <button type="button" data-value="1" aria-label="Strongly Agree">Agree</button>
            <button type="button" data-value="2" aria-label="Agree">Agree</button>
            <button type="button" data-value="3" aria-label="Slightly Agree">Agree</button>
            <button type="button" data-value="4" aria-label="Neutral">Neutral</button>
            <button type="button" data-value="5" aria-label="Slightly Disagree">Disagree</button>
            <button type="button" data-value="6" aria-label="Disagree">Disagree</button>
            <button type="button" data-value="7" aria-label="Strongly Disagree">Disagree</button>
          </div>
        </section>
      </form>
    </main>
  </body>
</html>
