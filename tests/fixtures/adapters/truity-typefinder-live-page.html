<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Personality Test of Myers & Briggs' 16 Types | TypeFinder®</title>
  </head>
  <body>
    <main>
      <div class="markup">
        <p>
          To take the personality test, mark your answers based on how well each statement describes
          you.
        </p>
      </div>
      <form method="POST">
        <section id="main-content">
          <div class="question-header">
            <p>From each pair, choose the phrase that describes you best.</p>
          </div>
          <div class="question question-radio">
            <div class="mt-3">
              <div class="question-grid emphasized">
                <span class="radio-label emphasized">I am often disorganized</span>
                <label class="radio"
                  ><input type="radio" name="t2323" value="1" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2323" value="2" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2323" value="3" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2323" value="4" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2323" value="5" autocomplete="off"
                /></label>
                <span class="radio-label emphasized">I keep myself organized</span>
              </div>
            </div>
          </div>
          <div class="question question-radio">
            <div class="mt-3">
              <div class="question-grid emphasized">
                <span class="radio-label emphasized">I make decisions with my head</span>
                <label class="radio"
                  ><input type="radio" name="t2324" value="1" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2324" value="2" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2324" value="3" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2324" value="4" autocomplete="off"
                /></label>
                <label class="radio"
                  ><input type="radio" name="t2324" value="5" autocomplete="off"
                /></label>
                <span class="radio-label emphasized">I make decisions with my heart</span>
              </div>
            </div>
          </div>
        </section>
        <div class="text-center">Step 1 of 8</div>
      </form>
    </main>
  </body>
</html>
